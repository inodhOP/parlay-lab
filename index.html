const TEAMS={ATL:["Atlanta Hawks",8,6,"#c8102e"],BOS:["Boston Celtics",11,2,"#007a33"],BKN:["Brooklyn Nets",3,9,"#3d3d45"],CHA:["Charlotte Hornets",4,9,"#1d8cab"],CHI:["Chicago Bulls",3,9,"#ce1141"],CLE:["Cleveland Cavaliers",7,7,"#860038"],DAL:["Dallas Mavericks",7,7,"#00538c"],DEN:["Denver Nuggets",7,4,"#1d3f6e"],DET:["Detroit Pistons",8,4,"#c8102e"],GSW:["Golden State Warriors",8,5,"#1d428a"],HOU:["Houston Rockets",11,3,"#ce1141"],IND:["Indiana Pacers",5,9,"#1f3f7a"],LAC:["LA Clippers",4,8,"#c8102e"],LAL:["Los Angeles Lakers",12,2,"#552583"],MEM:["Memphis Grizzlies",9,4,"#4d6594"],MIA:["Miami Heat",7,6,"#98002e"],MIL:["Milwaukee Bucks",1,13,"#00471b"],MIN:["Minnesota Timberwolves",9,4,"#236192"],NOP:["New Orleans Pelicans",4,10,"#1b3a5f"],NYK:["New York Knicks",7,6,"#d9701c"],OKC:["Oklahoma City Thunder",9,5,"#007ac1"],ORL:["Orlando Magic",5,7,"#0077c0"],PHI:["Philadelphia 76ers",11,3,"#006bb6"],PHX:["Phoenix Suns",5,7,"#c9541a"],POR:["Portland Trail Blazers",9,3,"#c8102e"],SAC:["Sacramento Kings",1,12,"#5a2d81"],SAS:["San Antonio Spurs",12,2,"#5f6670"],TOR:["Toronto Raptors",5,8,"#ce1141"],UTA:["Utah Jazz",1,13,"#4b2a7a"],WAS:["Washington Wizards",4,10,"#c8102e"]};
// results: [id, date, home, away, homeScore, awayScore]
const SEED_RESULTS=[
 ["b52d57da","2026-11-13","CHI","ATL",125,117],["89914f67","2026-11-13","MIA","CLE",133,121],["49362257","2026-11-13","HOU","UTA",125,118],["4267eeb5","2026-11-13","SAS","GSW",123,85],["e363a2cc","2026-11-13","SAC","POR",107,120],["818975f5","2026-11-13","LAC","OKC",113,112],
 ["48baa98d","2026-11-14","NOP","DEN",108,116],["881340d0","2026-11-14","CLE","DAL",127,117],["e4bc6bca","2026-11-14","MIA","DET",137,117],["63b95b1a","2026-11-14","MIN","CHI",106,117],["61d6f5fa","2026-11-14","MEM","BKN",129,110],
 ["921d9853","2026-11-15","PHI","IND",131,124],["76e135a8","2026-11-15","PHX","LAL",123,131],["954b3dec","2026-11-15","LAC","CHA",113,105],["9130aa45","2026-11-15","UTA","SAS",102,110],["645c0ffb","2026-11-15","TOR","NYK",108,112],["37d1bc3d","2026-11-15","BOS","DAL",131,94],["01374173","2026-11-15","WAS","HOU",119,147],["cd088d29","2026-11-15","MIL","ATL",106,113],["dd813a3b","2026-11-15","SAC","OKC",103,125]
].map(r=>({id:r[0],d:r[1],h:r[2],a:r[3],hs:r[4],as:r[5]}));
const SEED_SLATE={date:"Mon Nov 16",games:[
 {a:"MEM",h:"WAS",t:"7:00 PM ET",wa:62,wh:38},{a:"ORL",h:"BOS",t:"7:00 PM ET",wa:22.7,wh:77.3},{a:"CHI",h:"CLE",t:"7:00 PM ET",wa:22.3,wh:77.7},
 {a:"PHI",h:"BKN",t:"7:30 PM ET",wa:67.2,wh:32.8},{a:"HOU",h:"MIA",t:"7:30 PM ET",wa:57.6,wh:42.4},{a:"GSW",h:"NOP",t:"8:00 PM ET",wa:57.9,wh:42.1},
 {a:"POR",h:"MIN",t:"8:00 PM ET",wa:44.1,wh:55.9},{a:"PHX",h:"DEN",t:"9:00 PM ET",wa:20.3,wh:79.7}]};

// ---------- state ----------
const state={view:"home",feed:"tonight",q:"",bLegs:3,bMin:60,stake:"10",banner:true,book:"BetGuard",adult:false};

let results=[...SEED_RESULTS], slate=SEED_SLATE, prev=null, rec=Object.create(null), form={}, slip=[], follows=[], built=[];

const isNum=x=>typeof x==="number"&&Number.isFinite(x);

Object.keys(TEAMS).forEach(t=>rec[t]={w:TEAMS[t][1],l:TEAMS[t][2]});
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
slip=load("pl2_slip",[]); follows=load("pl2_follow",[]); state.banner=load("pl2_banner",true)!==false; state.adult=load("pl_19",false)===true;

{const b=load("pl_book","BetGuard");state.book=BOOKS.includes(b)?b:"BetGuard"}
const bk=()=>state.book==="Other"?"your sportsbook":state.book, bkS=()=>state.book==="Other"?"your sportsbook's":state.book+"'s";

slip=slip.filter(l=>l&&typeof l.k==="string"&&typeof l.team==="string"&&typeof l.date==="string");
follows=[...new Set(follows.filter(isTeam))];
const savedSlip=slip.map(l=>({k:l.k,team:l.team,date:l.date}));

// ---------- model ----------
const HOME_EDGE=1.3; // home teams win a bit more often
const gkey=g=>g.a+"@"+g.h;
const findGame=k=>slate.games.find(g=>gkey(g)===k);
const legGame=l=>l.date===slate.date?findGame(l.k):(prev&&l.date===prev.date?prev.games.find(g=>gkey(g)===l.k):undefined); // a pick lives on the upcoming slate or on the day just played
const strength=t=>{const r=rec[t]||{w:0,l:0};return (r.w+3)/(r.w+r.l+6)}; // record pulled toward 50% so short seasons don't overreact
function prob(g){ // returns chance each side wins
  const sh=strength(g.h), sa=strength(g.a);
  const odds=(sh/(1-sh))/(sa/(1-sa))*HOME_EDGE, model=odds/(1+odds);
  const hasFeed=isNum(g.wh)&&isNum(g.wa)&&g.wh>=0&&g.wa>=0&&g.wh+g.wa>0;
  const feed=hasFeed?g.wh/(g.wh+g.wa):null;
  let p=feed==null?model:(model+feed)/2;
  p=Math.min(.97,Math.max(.03,p));
  return {h:p,a:1-p,model,feed};
}
const teamProb=(g,t)=>{const p=prob(g);return t===g.h?p.h:p.a};
function buildForm(){
  const F=Object.create(null);
  [...results].sort((x,y)=>y.d.localeCompare(x.d)).forEach(r=>{
    [[r.h,r.a,r.hs,r.as,true],[r.a,r.h,r.as,r.hs,false]].forEach(([t,o,ts,os,home])=>{(F[t]=F[t]||[]).push({w:ts>os,ts,os,opp:o,home,d:r.d})});
  });
  form=F;
}
function prune(){const seen=new Set();slip=slip.filter(l=>{const g=legGame(l), id=l.k+"|"+l.date;return g&&(l.team===g.h||l.team===g.a)&&!seen.has(id)&&seen.add(id)})} // does not save: the caller decides when
const legProb=l=>{const g=legGame(l);return g?teamProb(g,l.team):.5};
const slipProb=()=>slip.reduce((a,l)=>a*legProb(l),1);
const american=pr=>!(pr>0&&pr<1)?"n/a":pr>=.5?"-"+Math.round(pr/(1-pr)*100):"+"+Math.round((1-pr)/pr*100);
const pc=x=>Math.round(x*100)+"%";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const tname=t=>isTeam(t)?TEAMS[t][0]:String(t);
const recStr=t=>{const r=rec[t];return r?r.w+"-"+r.l:""};
const TZ="America/Toronto";
const nick=t=>{if(!isTeam(t))return String(t);const n=TEAMS[t][0];return t==="POR"?"Trail Blazers":n.split(" ").slice(-1)[0]};
const validTs=ts=>typeof ts==="string"&&!isNaN(new Date(ts));
const fmtDay=ts=>new Date(ts).toLocaleDateString("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"}).replace(/,/g,"");
const fmtTime=ts=>new Date(ts).toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"})+" ET";
const torDay=ts=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(ts));
function whenLine(g){if(!validTs(g.ts))return g.t||"";const today=torDay(new Date().toISOString()), d=torDay(g.ts), tm=fmtTime(g.ts), tom=torDay(new Date(Date.now()+864e5).toISOString());return (d===today?"Today, "+fmtDay(g.ts):d===tom?"Tomorrow, "+fmtDay(g.ts):fmtDay(g.ts))+" · "+tm}
function whereLine(g){const city=String(g.city||"").split(",")[0].trim(), place=[g.ven,city].filter(Boolean).join(", ");return (g.neu?"Neutral site":nick(g.h)+" home game")+(place?" · "+place:"")}
const isOut=s=>/^(out|suspension)/i.test(s);
const injOf=t=>(inj[t]||[]);
function injShort(t){const L=injOf(t);if(!L.length)return "";const o=L.filter(x=>isOut(x.s)).length, m=L.length-o;return nick(t)+" "+[o?o+" out":"",m?m+" may sit":""].filter(Boolean).join(", ")}
function injLine(g){const parts=[injShort(g.a),injShort(g.h)].filter(Boolean);return parts.length?"Injuries: "+parts.join(" · "):""}
const timeOnly=g=>validTs(g.ts)?fmtTime(g.ts):(g.t||"");

}

}

const anyGame=(k,date)=>{for(const o of [slate,prev])if(o&&o.date===date){const g=o.games.find(x=>gkey(x)===k);if(g)return g}return null};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00Z")-new Date(a+"T12:00:00Z"))/864e5);
function restText(t,g,S){
  if(!validTs(g.ts))return "";
  let last=null; const L=S&&S.l5&&S.l5[t]; if(L&&L.length)last=L.map(x=>x.day).sort().pop();
  if(!last){const f=(form[t]||[]).find(x=>x.d<torDay(g.ts));if(f)last=f.d}
  if(!last)return ""; const n=daysBetween(last,torDay(g.ts));
  return n<=0?"":n===1?"played yesterday (back-to-back)":(n-1)+" day"+(n-1===1?"":"s")+" off";
}

    S.l5[t]=b.events.slice(0,5).map(e=>{const home=String(e.homeTeamId)===id, ts=parseInt(home?e.homeTeamScore:e.awayTeamScore,10), os=parseInt(home?e.awayTeamScore:e.homeTeamScore,10), opp=code(e.opponent&&e.opponent.abbreviation);
      return Number.isFinite(ts)&&Number.isFinite(os)&&opp&&validTs(e.gameDate)?{w:ts>os,ts,os,opp,home,day:torDay(e.gameDate)}:null}).filter(Boolean)})}catch(e){}
  try{(Array.isArray(j.leaders)?j.leaders:[]).forEach(b=>{const t=code(b&&b.team&&b.team.abbreviation);if(!t||!Array.isArray(b.leaders))return;
    S.lead[t]=b.leaders.map(c=>{const x=c&&Array.isArray(c.leaders)?c.leaders[0]:null, nm=x&&x.athlete&&typeof x.athlete.displayName==="string"?x.athlete.displayName.slice(0,40):"", v=x?parseFloat(x.displayValue):NaN, lab={pointsPerGame:"pts",reboundsPerGame:"reb",assistsPerGame:"ast"}[c&&c.name];
      return nm&&lab&&Number.isFinite(v)?{n:nm,v,lab}:null}).filter(Boolean)})}catch(e){}
  try{const sr=Array.isArray(j.seasonseries)?j.seasonseries[0]:null;if(sr){S.ser={sum:typeof sr.summary==="string"?sr.summary.slice(0,60):"",games:(Array.isArray(sr.events)?sr.events:[]).filter(e=>e&&e.statusType&&e.statusType.completed).map(e=>{const cs=Array.isArray(e.competitors)?e.competitors:[], H=cs.find(c=>c.homeAway==="home"), A=cs.find(c=>c.homeAway==="away");if(!H||!A)return null;const h=code(H.team&&H.team.abbreviation), a=code(A.team&&A.team.abbreviation), hs=parseInt(H.score,10), as=parseInt(A.score,10);return h&&a&&Number.isFinite(hs)&&Number.isFinite(as)&&validTs(e.date)?{h,a,hs,as,day:torDay(e.date),ot:/OT/.test(String(e.statusType.shortDetail||""))}:null}).filter(Boolean).slice(0,4)}}}catch(e){}

      Object.keys(TEAMS).forEach(t=>byName[TEAMS[t][0].toLowerCase()]=t);
      (Array.isArray(ij.injuries)?ij.injuries:[]).forEach(tm=>{const t=byName[String(tm&&tm.displayName||"").toLowerCase()];if(!t||!Array.isArray(tm.injuries))return;
        fresh[t]=tm.injuries.map(x=>{const nm=x&&x.athlete&&typeof x.athlete.displayName==="string"?x.athlete.displayName.slice(0,40):"";const st=typeof x.status==="string"?x.status.slice(0,20):"";return nm&&st?{n:nm,s:st,c:typeof x.shortComment==="string"?x.shortComment.slice(0,220):""}:null}).filter(Boolean).slice(0,15)});
      inj=fresh; injAt=Date.now();
    }catch(err){}
    const bump=(t,r)=>{if(r&&r.w+r.l<=82&&r.w+r.l>=rec[t].w+rec[t].l)rec[t]=r};
    [...late,...(first||[]),...sl.games].forEach(g=>{bump(g.h,g.rh);bump(g.a,g.ra)});
    // 4. swap in the new slate
    const oldBy=Object.create(null);[slate,prev].forEach(o=>{if(o)oldBy[o.date]=o.games});
    [sl,pv].forEach(dy=>{if(dy)dy.games.forEach(g=>{if(g.state!=="pre"&&g.wa==null){const old=(oldBy[dayLabel(dy.iso)]||[]).find(o=>o.a===g.a&&o.h===g.h);if(old&&isNum(old.wa)&&isNum(old.wh)){g.wa=old.wa;g.wh=old.wh;g.mla=old.mla;g.mlh=old.mlh;g.prov=old.prov;g.spH=old.spH;g.tot=old.tot}}})}); // keep the pre-game line after tip-off
    const next=cleanSlate({date:dayLabel(sl.iso),games:sl.games});
    if(next){slate=next;live=true}
    const pclean=pv?cleanSlate({date:dayLabel(pv.iso),games:pv.games}):null; if(pclean)pclean.show=pv.show; prev=pclean;
    results.sort((x,y)=>y.d.localeCompare(x.d)); if(results.length>400)results.length=400;
    updatedAt=Date.now(); net="ok";
    buildForm(); prune();
    if(!restored){restored=true;dropped.forEach(sv=>{if(!slip.some(l=>l.k===sv.k))slip.push(sv)});prune()}
    gcOdds(); store("pl2_slip",slip);
    store("pl3_cache",{slate,prev,rec:Object.assign({},rec),results,updatedAt,season,days:doneDays,inj,injAt});
    if(manual)toast("Updated");
  }catch(e){net="fail";if(manual)toast("Could not reach the data source")}
  busy=false; softRender();
}
function gcOdds(){const keep=new Set(slip.map(okey));let ch=false;Object.keys(legOdds).forEach(k=>{if(!keep.has(k)){delete legOdds[k];ch=true}});if(ch)store("pl3_odds",Object.assign({},legOdds))}
function softRender(){const ae=document.activeElement;if((ae&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))||$("copyout")){renderHeader()}else{render();if(sheet)renderSheet()}} // never rebuild a box someone is typing in
refresh(false);
setInterval(()=>{if(!document.hidden)refresh(false)},5*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-updatedAt>2*60*1000)refresh(false)});
</script>
